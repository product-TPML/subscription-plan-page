<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 14 96 98" width="100%" height="100%" fill="none" stroke="#000000" stroke-width="4">
  <!-- Single Front Page Newspaper Base -->
  <rect x="24" y="32" width="60" height="76" rx="4" fill="#FFFFFF" stroke-width="4" />
  
  <!-- Fold / Crease Line on Left Edge -->
  <line x1="30" y1="32" x2="30" y2="108" stroke="#E9ECEF" stroke-width="2" />

  <!-- Main Newspaper Header / Title Bar -->
  <line x1="34" y1="44" x2="66" y2="44" stroke-width="4" />
  <line x1="34" y1="50" x2="58" y2="50" stroke-width="2.5" />
  
  <!-- Divider Line -->
  <line x1="34" y1="56" x2="74" y2="56" stroke="#000000" stroke-width="2" stroke-dasharray="2 2" />

  <!-- Front Page Featured Image Placeholder -->
  <rect x="34" y="62" width="24" height="20" rx="2" fill="#E9ECEF" stroke-width="2.5" />
  
  <!-- Article Text Columns -->
  <line x1="62" y1="62" x2="74" y2="62" stroke-width="2.5" />
  <line x1="62" y1="68" x2="74" y2="68" stroke-width="2.5" />
  <line x1="62" y1="74" x2="74" y2="74" stroke-width="2.5" />
  <line x1="62" y1="80" x2="70" y2="80" stroke-width="2.5" />
  
  <line x1="34" y1="88" x2="74" y2="88" stroke-width="2.5" />
  <line x1="34" y1="94" x2="74" y2="94" stroke-width="2.5" />
  <line x1="34" y1="100" x2="60" y2="100" stroke-width="2.5" />

  <!-- Globe Overlay (Top Right) -->
  <g transform="translate(16, 4)">
    <!-- White Background Mask -->
    <circle cx="72" cy="36" r="22" fill="#FFFFFF" stroke-width="4" />
    
    <!-- Latitude Lines -->
    <line x1="50" y1="36" x2="94" y2="36" stroke-width="3" />
    <path d="M 53 26 Q 72 31 91 26" stroke-width="2.5" />
    <path d="M 53 46 Q 72 41 91 46" stroke-width="2.5" />
    
    <!-- Longitude Lines -->
    <line x1="72" y1="14" x2="72" y2="58" stroke-width="3" />
    <ellipse cx="72" cy="36" rx="12" ry="22" stroke-width="2.5" />
  </g>
</svg>